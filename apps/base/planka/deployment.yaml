apiVersion: apps/v1
kind: Deployment
metadata:
  name: planka
  labels:
    app.kubernetes.io/name: planka
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: planka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: planka
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL (postgres-service:5432) to be ready..."
              until nc -z -v -w3 postgres-service 5432; do
                echo "PostgreSQL is unavailable - sleeping 2 seconds"
                sleep 2
              done
              echo "PostgreSQL is ready! Starting Planka..."
      containers:
        - name: planka
          image: ghcr.io/plankanban/planka:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 1337
          envFrom:
            - configMapRef:
                name: planka-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: planka-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: planka-secrets
                  key: SECRET_KEY
          volumeMounts:
            - name: user-data
              mountPath: /app/public/user-avatars
              subPath: user-avatars
            - name: user-data
              mountPath: /app/private/attachments
              subPath: attachments
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 1337
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 1337
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: user-data
          persistentVolumeClaim:
            claimName: planka-user-data
